# Not an installable package: run everything from the repo root
# (top-level names like `control` would clash with PyPI packages if installed).
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "proprio-yoyo"
version = "0.1.0"
description = "Actuator-as-sensor yo-yo robot: simulator, environment and visualization"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "sympy>=1.11",
    "jax",
    "cma",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["sim*", "yoyo*", "arm*", "control*", "viz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]